name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (format + credo)
    runs-on: ubuntu-latest
    container:
      image: elixir:1.20.1-otp-29
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y build-essential git libsqlite3-dev sqlite3 pkg-config libssl-dev curl

      - name: Install Rust toolchain (native NIFs, e.g. mdex_native / ex_sctp)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set up mix
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Credo (strict)
        run: mix credo --strict

      - name: Audit dependencies for known vulnerabilities
        run: mix deps.audit

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    container:
      image: elixir:1.20.1-otp-29
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y build-essential git libsqlite3-dev sqlite3 pkg-config libssl-dev curl

      - name: Install Rust toolchain (native NIFs, e.g. mdex_native / ex_sctp)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set up mix
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: MIX_ENV=dev mix deps.get

      # The .plt.hash is deliberately not cached: restoring it makes dialyxir
      # report "PLT is up to date" and skip revalidation, so modules added
      # since the cache was written would look like they do not exist.
      - name: Cache PLTs
        uses: actions/cache@v6
        with:
          path: _build/dev/*.plt
          key: plt-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-

      - name: Run dialyzer
        run: MIX_ENV=dev mix dialyzer --format github

  test:
    name: Build & test (SQLite)
    runs-on: ubuntu-latest
    container:
      image: elixir:1.20.1-otp-29
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y build-essential git libsqlite3-dev sqlite3 pkg-config libssl-dev curl

      - name: Install Rust toolchain (native NIFs, e.g. mdex_native / ex_sctp)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set up mix
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: MIX_ENV=test mix deps.get

      - name: Compile (warnings as errors)
        run: MIX_ENV=test mix compile --warnings-as-errors

      - name: Run tests
        run: MIX_ENV=test mix test

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Validates the Dockerfile builds end-to-end (deps, plugins, assets).
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: gamend-starter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # What Gamend Cloud pulls for a server on this repository instead of
  # compiling every dependency on its machine (GamendCloud.Builds): a release
  # for each database, as the server's own `podman build` would make it. A
  # commit not published yet is built there. Only here: a fork has no use for it.
  publish:
    name: Publish release image (${{ matrix.adapter }})
    if: github.repository == 'appsinacup/gamend_starter' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        adapter: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: release
          build-args: |
            GAMEND_DB_ADAPTER=${{ matrix.adapter }}
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=publish-${{ matrix.adapter }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.adapter }}
          push: true
          tags: |
            ghcr.io/appsinacup/gamend_starter:${{ github.sha }}-${{ matrix.adapter }}
            ghcr.io/appsinacup/gamend_starter:latest-${{ matrix.adapter }}
